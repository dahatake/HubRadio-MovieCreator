<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">HubRadio MovieCreator local-first architecture</title>
  <desc id="desc">Stage 0 measurements and the local Stage 1 baseline are approved. The diagram also shows the planned Stage 1 Windows desktop architecture. Green components are implemented, blue components are planned, and the purple dashed Azure path is conditional. Models and detectors that were rejected or held are excluded from the product path.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#334155"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#047857"/>
    </marker>
    <marker id="arrowPurple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#7c3aed"/>
    </marker>
    <style>
      .title { font: 700 34px "Segoe UI", "Yu Gothic UI", sans-serif; fill: #ffffff; }
      .subtitle { font: 400 18px "Segoe UI", "Yu Gothic UI", sans-serif; fill: #dbeafe; }
      .section { font: 700 20px "Segoe UI", "Yu Gothic UI", sans-serif; fill: #0f172a; }
      .box-title { font: 700 18px "Segoe UI", "Yu Gothic UI", sans-serif; fill: #0f172a; }
      .box-text { font: 400 14px "Segoe UI", "Yu Gothic UI", sans-serif; fill: #334155; }
      .small { font: 600 12px "Segoe UI", "Yu Gothic UI", sans-serif; fill: #475569; }
      .label { font: 600 13px "Segoe UI", "Yu Gothic UI", sans-serif; fill: #334155; }
      .badge { font: 700 11px "Segoe UI", "Yu Gothic UI", sans-serif; letter-spacing: .5px; }
      .flow-title { font: 700 15px "Segoe UI", "Yu Gothic UI", sans-serif; fill: #0f172a; }
      .flow-text { font: 400 12px "Segoe UI", "Yu Gothic UI", sans-serif; fill: #475569; }
    </style>
  </defs>

  <rect width="1600" height="1120" fill="url(#background)"/>
  <rect x="0" y="0" width="1600" height="118" fill="url(#header)"/>
  <text x="70" y="52" class="title">HubRadio MovieCreator</text>
  <text x="70" y="84" class="subtitle">Local-first / Non-destructive / Human-governed video editing architecture</text>

  <!-- Legend -->
  <g transform="translate(1000 30)">
    <rect x="0" y="0" width="158" height="50" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <circle cx="20" cy="25" r="7" fill="#16a34a"/>
    <text x="36" y="30" class="label">現在実装済み</text>

    <rect x="174" y="0" width="140" height="50" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <circle cx="194" cy="25" r="7" fill="#2563eb"/>
    <text x="210" y="30" class="label">実装予定</text>

    <rect x="330" y="0" width="195" height="50" rx="12" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2" stroke-dasharray="8 6"/>
    <circle cx="350" cy="25" r="7" fill="#7c3aed"/>
    <text x="366" y="30" class="label">条件付きAzure</text>
  </g>

  <!-- User -->
  <g filter="url(#shadow)">
    <rect x="50" y="210" width="190" height="150" rx="24" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
    <circle cx="145" cy="250" r="25" fill="#cbd5e1"/>
    <path d="M 94 324 C 98 285, 192 285, 196 324 Z" fill="#cbd5e1"/>
    <text x="145" y="345" text-anchor="middle" class="box-title">Windows利用者</text>
    <text x="145" y="371" text-anchor="middle" class="box-text">企画・編集・レビュー・承認</text>
  </g>

  <!-- Desktop boundary -->
  <rect x="290" y="150" width="800" height="610" rx="30" fill="#ffffff" fill-opacity="0.70" stroke="#2563eb" stroke-width="3" stroke-dasharray="12 8"/>
  <text x="320" y="186" class="section">Windows 11 x64 デスクトップ境界 — Stage 1目標</text>

  <!-- UI -->
  <g filter="url(#shadow)">
    <rect x="335" y="215" width="700" height="108" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <rect x="355" y="236" width="180" height="66" rx="12" fill="#eff6ff" stroke="#60a5fa"/>
    <text x="445" y="263" text-anchor="middle" class="box-title">WinUI 3 Shell</text>
    <text x="445" y="286" text-anchor="middle" class="box-text">window / picker / startup</text>

    <rect x="555" y="236" width="455" height="66" rx="12" fill="#eff6ff" stroke="#60a5fa"/>
    <text x="782" y="263" text-anchor="middle" class="box-title">WebView2 + React Static UI</text>
    <text x="782" y="286" text-anchor="middle" class="box-text">timeline / transcript / layout / review</text>
  </g>

  <!-- .NET host -->
  <g filter="url(#shadow)">
    <rect x="335" y="362" width="700" height="242" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="365" y="394" class="box-title">HubRadio.App.exe — 単一.NETホスト</text>
    <text x="1000" y="394" text-anchor="end" class="small">localhost HTTP serverなし</text>

    <rect x="360" y="420" width="195" height="150" rx="14" fill="#eff6ff" stroke="#60a5fa"/>
    <text x="457" y="452" text-anchor="middle" class="box-title">Application</text>
    <text x="457" y="480" text-anchor="middle" class="box-text">use case / job</text>
    <text x="457" y="504" text-anchor="middle" class="box-text">review / delivery</text>
    <text x="457" y="528" text-anchor="middle" class="box-text">WebMessage bridge</text>

    <rect x="575" y="420" width="205" height="150" rx="14" fill="#eff6ff" stroke="#60a5fa"/>
    <text x="677" y="452" text-anchor="middle" class="box-title">Core</text>
    <text x="677" y="480" text-anchor="middle" class="box-text">RationalTime / SourceSpan</text>
    <text x="677" y="504" text-anchor="middle" class="box-text">CompositionVersion</text>
    <text x="677" y="528" text-anchor="middle" class="box-text">policy / Render IR</text>

    <rect x="800" y="420" width="210" height="150" rx="14" fill="#eff6ff" stroke="#60a5fa"/>
    <text x="905" y="452" text-anchor="middle" class="box-title">Infrastructure</text>
    <text x="905" y="480" text-anchor="middle" class="box-text">SQLite / file / backup</text>
    <text x="905" y="504" text-anchor="middle" class="box-text">process / integrity</text>
    <text x="905" y="528" text-anchor="middle" class="box-text">atomic artifact store</text>
  </g>

  <!-- Planned storage -->
  <g filter="url(#shadow)">
    <rect x="335" y="635" width="330" height="94" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <ellipse cx="395" cy="673" rx="34" ry="14" fill="#bfdbfe" stroke="#2563eb"/>
    <path d="M 361 673 L 361 704 C 361 722 429 722 429 704 L 429 673" fill="#bfdbfe" stroke="#2563eb"/>
    <text x="455" y="671" class="box-title">SQLite</text>
    <text x="455" y="696" class="box-text">index / jobs / versions / audit</text>

    <rect x="690" y="635" width="345" height="94" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <path d="M 720 667 h42 l12 12 h76 v35 h-130 z" fill="#bfdbfe" stroke="#2563eb"/>
    <text x="875" y="671" class="box-title">管理ワークスペース</text>
    <text x="875" y="696" class="box-text">original / proxy / analysis / render / delivery</text>
  </g>

  <!-- Subprocess boundary -->
  <rect x="1145" y="150" width="405" height="450" rx="30" fill="#ffffff" fill-opacity="0.74" stroke="#f59e0b" stroke-width="3" stroke-dasharray="12 8"/>
  <text x="1175" y="186" class="section">隔離子プロセス境界</text>

  <!-- FFmpeg implemented -->
  <g filter="url(#shadow)">
    <rect x="1190" y="222" width="315" height="142" rx="20" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
    <rect x="1210" y="240" width="77" height="24" rx="12" fill="#16a34a"/>
    <text x="1248" y="257" text-anchor="middle" class="badge" fill="#ffffff">CURRENT</text>
    <text x="1347" y="290" text-anchor="middle" class="box-title">FFmpeg / ffprobe</text>
    <text x="1347" y="317" text-anchor="middle" class="box-text">probe / transcode / render / full decode QC</text>
    <text x="1347" y="340" text-anchor="middle" class="box-text">binary hash + no shell + timeout</text>
  </g>

  <!-- Python planned -->
  <g filter="url(#shadow)">
    <rect x="1190" y="405" width="315" height="142" rx="20" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <rect x="1210" y="423" width="72" height="24" rx="12" fill="#2563eb"/>
    <text x="1246" y="440" text-anchor="middle" class="badge" fill="#ffffff">PLAN</text>
    <text x="1347" y="473" text-anchor="middle" class="box-title">Python ML Worker</text>
    <text x="1347" y="500" text-anchor="middle" class="box-text">ASR / adopted local analysis</text>
    <text x="1347" y="523" text-anchor="middle" class="box-text">NDJSON / held models excluded</text>
  </g>

  <!-- Conditional Azure -->
  <g filter="url(#shadow)">
    <rect x="1190" y="645" width="315" height="118" rx="20" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="9 7"/>
    <rect x="1210" y="663" width="112" height="24" rx="12" fill="#7c3aed"/>
    <text x="1266" y="680" text-anchor="middle" class="badge" fill="#ffffff">CONDITIONAL</text>
    <text x="1347" y="715" text-anchor="middle" class="box-title">Microsoft Azure AI</text>
    <text x="1347" y="741" text-anchor="middle" class="box-text">selected + masked + confirmed text span only</text>
  </g>

  <!-- Current Stage 0 -->
  <rect x="50" y="810" width="1500" height="230" rx="28" fill="#ecfdf5" stroke="#16a34a" stroke-width="3"/>
  <text x="80" y="850" class="section">現在実装済み — Stage 0 evidence pipeline</text>

  <g filter="url(#shadow)">
    <rect x="85" y="884" width="245" height="118" rx="18" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <text x="207" y="919" text-anchor="middle" class="flow-title">1. Fixture guard</text>
    <text x="207" y="947" text-anchor="middle" class="flow-text">path / size / SHA-256</text>
    <text x="207" y="969" text-anchor="middle" class="flow-text">rights: local evaluation only</text>

    <rect x="385" y="884" width="245" height="118" rx="18" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <text x="507" y="919" text-anchor="middle" class="flow-title">2. Benchmark harness</text>
    <text x="507" y="947" text-anchor="middle" class="flow-text">schema / timeout / redaction</text>
    <text x="507" y="969" text-anchor="middle" class="flow-text">success + failure JSON</text>

    <rect x="685" y="884" width="245" height="118" rx="18" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <text x="807" y="919" text-anchor="middle" class="flow-title">3. Staged render</text>
    <text x="807" y="947" text-anchor="middle" class="flow-text">NVENC H.264 / AAC</text>
    <text x="807" y="969" text-anchor="middle" class="flow-text">source global metadata omitted</text>

    <rect x="985" y="884" width="245" height="118" rx="18" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <text x="1107" y="919" text-anchor="middle" class="flow-title">4. Output QC</text>
    <text x="1107" y="947" text-anchor="middle" class="flow-text">ffprobe profile + full decode</text>
    <text x="1107" y="969" text-anchor="middle" class="flow-text">duration / audio / pix_fmt</text>

    <rect x="1285" y="884" width="230" height="118" rx="18" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <text x="1400" y="919" text-anchor="middle" class="flow-title">5. Atomic evidence</text>
    <text x="1400" y="947" text-anchor="middle" class="flow-text">output + manifest pair</text>
    <text x="1400" y="969" text-anchor="middle" class="flow-text">rollback + problem history</text>
  </g>

  <!-- Arrows -->
  <path d="M 240 285 C 265 285, 270 269, 320 269" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="264" y="251" class="label">操作</text>

  <path d="M 780 323 L 780 352" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="795" y="344" class="label">typed WebMessage</text>

  <path d="M 1035 485 C 1090 485, 1115 293, 1180 293" fill="none" stroke="#047857" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <text x="1065" y="373" class="label">ArgumentList</text>

  <path d="M 1035 515 C 1090 515, 1125 476, 1180 476" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1070" y="507" class="label">NDJSON</text>

  <path d="M 905 570 L 905 625" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="918" y="608" class="label">staging → hash → move</text>

  <path d="M 675 570 C 640 595, 520 605, 475 625" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="525" y="593" class="label">transaction</text>

  <path d="M 1035 547 C 1130 575, 1125 704, 1180 704" fill="none" stroke="#7c3aed" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrowPurple)"/>
  <text x="1068" y="646" class="label" fill="#7c3aed">明示承認済みtextのみ</text>

  <path d="M 330 943 L 375 943" fill="none" stroke="#047857" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <path d="M 630 943 L 675 943" fill="none" stroke="#047857" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <path d="M 930 943 L 975 943" fill="none" stroke="#047857" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <path d="M 1230 943 L 1275 943" fill="none" stroke="#047857" stroke-width="3" marker-end="url(#arrowGreen)"/>

  <text x="800" y="1062" text-anchor="middle" class="small">Current: Stage 0 approved / ST-008 condition-false / A-012 and A-013 held for re-evaluation</text>
  <text x="800" y="1088" text-anchor="middle" class="small">Foundation complete / Domain + process contracts in progress / Azure gate closed</text>
</svg>
