[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hubradio-worker"
version = "0.1.0"
description = "Local Python worker for HubRadio MovieCreator"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
test = ["pytest==9.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "9.0"
addopts = [
    "--strict-config",
    "--strict-markers",
]
testpaths = ["tests"]
xfail_strict = true
